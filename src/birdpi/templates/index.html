<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BirdPi</title>
</head>

<body>

<h1>🐦 BirdPi</h1>
<p>Nature Observation Node</p>

<form action="{{ url_for('capture') }}" method="post">
    <button type="submit">📸 Capture image</button>
</form>

{% if latest_image %}
    <p>Latest image: {{ latest_image.name }}</p>
    <img
        src="{{ url_for('image', filename=latest_image.name) }}"
        alt="Latest BirdPi image"
        style="max-width: 100%; height: auto;"
    >
{% else %}
    <p>No images available.</p>
{% endif %}
</body>
</html>
