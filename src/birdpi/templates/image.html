{% extends "base.html" %}

{% block title %}BirdPi Image{% endblock %}

{% block content %}

<section class="card">
    <h2>
        {{ image.captured_at.strftime("%d.%m.%Y %H:%M:%S") }}
    </h2>

    <img
            class="camera-image"
            src="{{ url_for('web.image', filename=image.filename) }}"
            alt="{{ image.filename }}"
    >
</section>

{% endblock %}
