[build-system]
requires = ["setuptools>=80", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "birdpi"
dynamic = ["version"]
description = "Bird house observation system based on Raspberry Pi"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "Flask>=3.1",
    "astral>=3.2",
    "gpiozero>=2.0",
    "gunicorn>=26.0",
    "lgpio>=0.2.2",
    "numpy>=2.5",
    "opencv-python-headless>=5.0",
    "python-telegram-bot>=22.8",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
# automated version detection
version_file = "src/birdpi/_version.py"